
name: Generate Profile Cards

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate Profile Cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: z5git
          cards: overview,lifetime,languages
          output-dir: assets
          themes: light,dark
          commit: true
